<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430">
  <style>
    .edge{fill:none;stroke:#111;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
    .thin{fill:none;stroke:#111;stroke-width:2.4}
    .shade{fill:#d9d9d9}
    .label{font-family:Arial,'Noto Sans CJK SC',sans-serif;font-size:22px;fill:#111}
    .caption{font-family:Arial,'Noto Sans CJK SC',sans-serif;font-size:24px;font-weight:600;fill:#111}
    .note{font-family:Arial,'Noto Sans CJK SC',sans-serif;font-size:18px;fill:#333}
  </style>

  <!-- 图1：按题意重绘，不按比例。先将两个正方形整体设为阴影，再扣除两个白色三角形 ADH、HEF。 -->
  <text x="185" y="35" class="caption">图1</text>

  <!-- 两个正方形整体阴影 -->
  <rect x="70" y="70" width="250" height="250" class="shade"/>
  <rect x="320" y="170" width="150" height="150" class="shade"/>

  <!-- 白色三角形 ADH -->
  <polygon points="70,320 70,70 270,320" fill="white"/>
  <!-- 白色三角形 HEF；H-E 为底，F 为顶点 -->
  <polygon points="270,320 470,320 470,170" fill="white"/>

  <!-- 外框和连接线 -->
  <rect x="70" y="70" width="250" height="250" class="edge"/>
  <rect x="320" y="170" width="150" height="150" class="edge"/>
  <line x1="70" y1="70" x2="270" y2="320" class="thin"/>
  <line x1="270" y1="320" x2="470" y2="170" class="thin"/>

  <text x="52" y="344" class="label">A</text>
  <text x="312" y="344" class="label">B</text>
  <text x="312" y="62" class="label">C</text>
  <text x="50" y="62" class="label">D</text>
  <text x="476" y="344" class="label">E</text>
  <text x="476" y="166" class="label">F</text>
  <text x="309" y="166" class="label">G</text>
  <text x="258" y="347" class="label">H</text>
  <text x="125" y="365" class="note">H 为 AE 中点</text>

  <!-- 图2：保留此前示意 -->
  <text x="665" y="35" class="caption">图2</text>
  <rect x="570" y="70" width="250" height="250" class="edge"/>
  <line x1="720" y1="70" x2="720" y2="320" class="thin"/>
  <line x1="570" y1="170" x2="820" y2="170" class="thin"/>
  <rect x="570" y="70" width="150" height="100" fill="#d9d9d9" stroke="#111" stroke-width="2.4"/>
  <text x="632" y="130" class="label">16</text>
  <text x="758" y="260" class="label">乙</text>
  <text x="565" y="348" class="note">示意图按题意重绘，不按比例</text>
</svg>
